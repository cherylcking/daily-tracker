<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading tracker…</title>
<style>
  body { margin:0; background:#0f0f1a; display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; font-family:-apple-system,sans-serif; color:#aaa; }
  .spinner { width:40px; height:40px; border:3px solid #333; border-top-color:#7c3aed; border-radius:50%; animation:spin 0.8s linear infinite; margin-bottom:16px; }
  @keyframes spin { to { transform:rotate(360deg); } }
  p { font-size:14px; }
</style>
</head>
<body>
<div class="spinner"></div>
<p id="msg">Syncing your data…</p>
<script>
const SB_URL = 'https://rankahhsqzhipkshibpj.supabase.co';
const SB_KEY = 'sb_publishable_VxsDCmlmYbnunoi7OCjdWg_2Dgcfu7q';
const SK = 'dt_v3';

async function go() {
  try {
    const r = await fetch(SB_URL + '/rest/v1/tracker_data?id=eq.main&select=data', {
      headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY }
    });
    const rows = await r.json();
    const d = rows?.[0]?.data;
    const hasData = d && ((d.taskBank?.length ?? 0) > 0 || Object.keys(d.logs || {}).length > 0);
    if (hasData) {
      localStorage.setItem(SK, JSON.stringify(d));
      document.getElementById('msg').textContent = 'Got it — opening tracker…';
    } else {
      document.getElementById('msg').textContent = 'Opening tracker…';
    }
  } catch(e) {
    document.getElementById('msg').textContent = 'Offline — opening tracker with local data…';
  }
  setTimeout(() => { window.location.replace('https://cherylcking.github.io/daily-tracker/'); }, 500);
}
go();
</script>
</body>
</html>
